<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#282a36" media="(prefers-color-scheme: dark)" />

		<!-- Icons -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="alternate icon" href="%sveltekit.assets%/favicon.ico" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="mask-icon" href="/favicon.svg" color="#FFFFFF" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="apple-touch-startup-image" href="/launch.png" />

		<!-- Preconnect for important origins -->
		<link rel="preconnect" href="https://www.googleapis.com" />
		<link rel="preconnect" href="https://apis.google.com" />
		<link rel="preconnect" href="https://firestore.googleapis.com" />
		<link rel="preconnect" href="https://identitytoolkit.googleapis.com" />

		<!-- DNS-prefetch as a fallback -->
		<link rel="dns-prefetch" href="https://www.googleapis.com" />
		<link rel="dns-prefetch" href="https://apis.google.com" />
		<link rel="dns-prefetch" href="https://firestore.googleapis.com" />
		<link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />

		<link rel="manifest" crossorigin="use-credentials" href="/manifest.json" />

		<script>
			// iOS-only flag for installed (Home Screen) apps; set before first paint
			// so the header never jumps. See --app-inset-top in app.css.
			if (navigator.standalone) document.documentElement.classList.add('ios-standalone');
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
