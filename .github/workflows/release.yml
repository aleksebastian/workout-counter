name: Release

# Publishes a GitHub release whenever main ships a package.json version that
# doesn't have one yet, so bumping the version is the whole release step.
on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the release if this version has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version package.json)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already released"
            exit 0
          fi
          # Notes list the PRs merged since the previous release.
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
